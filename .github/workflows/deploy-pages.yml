name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Derlenen çıktı doğrudan gh-pages dalına yazılır.
permissions:
  contents: write

# Aynı anda tek yayın; süren bir yayın iptal edilmez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Pages dağıtım API'si (actions/deploy-pages) bu depoda dağıtımı
      # deployment_in_progress durumunda askıda bırakıyordu. Çıktıyı gh-pages
      # dalına push etmek, Pages'in dal tabanlı yayın hattını kullanır ve o
      # API'ye hiç dokunmaz.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
